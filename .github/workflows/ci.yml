name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN'ı en az yetkiyle sınırla.
# (CodeQL: actions/missing-workflow-permissions — varsayılan izinler gereğinden geniş)
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Derleme denetimi
        run: python -m compileall -q src

      - name: Testler (Tk gerekmez)
        run: ./tests/run.sh

      - name: Paket kurulabiliyor mu?
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet .
          syspano --surum
          syspano --kartlari-listele

  arayuz:
    name: Arayüz testleri (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Pano, kart ve terminal testleri (sanal ekranda)
        run: |
          xvfb-run -a env PYTHONPATH=src python3 tests/test_kartlar.py
          xvfb-run -a env PYTHONPATH=src python3 tests/test_uygulama.py
          xvfb-run -a env PYTHONPATH=src python3 tests/test_yerlesim.py

  kabuk:
    name: Kabuk betikleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n run.sh
          bash -n guncelle.sh
          bash -n kur-pi.sh
          bash -n tests/run.sh
