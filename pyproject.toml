[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syspano"
version = "1.0.0"
description = "Linux için cihazdan bağımsız sistem ve kaynak izleme panosu (CPU, RAM, sıcaklık, fan, pil, GPU, disk, ağ)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SysPano katkıcıları" }]
keywords = ["monitoring", "dashboard", "system", "tkinter", "raspberry-pi",
            "linux", "cpu", "gpu", "temperature"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# Tepsi simgesi (isteğe bağlı). Dağıtım paketi yeğlenir:
#   Debian/Ubuntu: sudo apt install python3-pyside6.qtwidgets
#   Fedora:        sudo dnf install python3-pyside6
tepsi = ["PySide6>=6.5"]
test = ["pytest>=7"]

[project.scripts]
syspano = "syspano.cli:main"

[project.urls]
Homepage = "https://github.com/kullanici/syspano"
Source = "https://github.com/kullanici/syspano"
Issues = "https://github.com/kullanici/syspano/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
