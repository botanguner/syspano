[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "syspano"
version = "1.11.0"
description = "Linux için ekran boyutuna ve DPI'a uyum sağlayan sistem ve kaynak izleme panosu"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SysPano" }]
keywords = ["monitoring", "dashboard", "linux", "tkinter", "raspberry-pi", "sysfs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

# Tkinter Python'la gelir; harici bağımlılık yoktur. Tepsi simgesi isteğe bağlıdır.
dependencies = []

[project.optional-dependencies]
tepsi = ["PySide6>=6.4"]

[project.scripts]
syspano = "syspano.cli:main"

[project.urls]
Homepage = "https://github.com/botanguner/syspano"
Kaynak = "https://github.com/botanguner/syspano"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
